name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les outils de test
        run: python -m pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Refuser secrets, modèles, audio et vidéo
        run: |
          set -euo pipefail
          forbidden=$(git ls-files | grep -Ei '(^|/)\.env$|\.(gguf|tflite|wav|mp3|m4a|flac|aac|ogg|key|pem|mp4|mkv|webm|mov|avi)$' || true)
          if [ -n "$forbidden" ]; then
            echo "Fichiers interdits versionnés :"
            echo "$forbidden"
            exit 1
          fi
          git ls-files -z | while IFS= read -r -d '' f; do
            sz=$(stat -c%s "$f")
            if [ "$sz" -gt 5242880 ]; then
              echo "$f dépasse 5 Mo ($sz octets)"
              exit 1
            fi
          done
